<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baldwin Alexandria</title>
<script src="../i18n.js"></script>  <!-- the language shared with the map: t(cs, en, sk) -->
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Baldwin Alexandria: chat with the source library of Baldwin Palantir and Baldwin Acre.
     Same look as the map: neutral graphite, dark frosted glass and white as the second colour. */
  :root { --bg: #0d0d0d; --text: #ececec; --muted: #8a8a8a; --faint: #5a5a5a; --accent: #f2f2f2;
          --glass: rgba(16,16,16,.55); --edge: rgba(255,255,255,.06); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: 'Hanken Grotesk', Arial, sans-serif; }
  body { display: flex; justify-content: center; }
  .wrap { width: 100%; max-width: 760px; height: 100%; display: flex; flex-direction: column; padding: 20px 16px 16px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 4px 4px 16px; }
  .brand { font-size: 15px; letter-spacing: .34em; }
  .brand b { font-weight: 600; } .brand span { color: var(--muted); font-weight: 400; }
  .sub { font-size: 11px; color: var(--muted); letter-spacing: .04em; margin-top: 6px; }
  /* back to the map: the palantír orb, the same button as the lighthouse on the map page; its name slides
     out to the right from behind the orb on hover */
  .orb-link { align-self: center; flex-shrink: 0; display: flex; align-items: center; height: 34px; border-radius: 6px;
              background: rgba(255,255,255,.07); color: var(--text); text-decoration: none; overflow: hidden;
              transition: transform 1.2s cubic-bezier(.16,1,.3,1); }
  .orb-link:hover { transform: scale(1.03); }
  .orb-link .ic { display: grid; place-items: center; width: 40px; height: 34px; flex-shrink: 0; }
  .orb-link svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.4; stroke-linecap: round; stroke-linejoin: round; }
  .orb-link .tx { max-width: 0; opacity: 0; transform: translateX(-24px); white-space: nowrap; font-size: 11px; letter-spacing: .3em;
                  transition: max-width 3.2s cubic-bezier(.16,1,.3,1), opacity 2.2s ease .3s, transform 3.2s cubic-bezier(.16,1,.3,1),
                              padding 3.2s cubic-bezier(.16,1,.3,1); }
  .orb-link .tx b { font-weight: 600; } .orb-link .tx span { font-weight: 400; color: var(--muted); }
  .orb-link:hover .tx { max-width: 260px; opacity: 1; transform: none; padding-right: 16px; }
  @media (hover: none) { .orb-link:hover .tx { max-width: 0; opacity: 0; padding-right: 0; } }
  /* languages, and the switcher right of the orb (the same as on the map) */
  .l-cs, .l-en, .l-sk { display: none; }
  html[lang=cs] .l-cs, html[lang=en] .l-en, html[lang=sk] .l-sk { display: inline; }
  .hr { align-self: center; display: flex; align-items: center; gap: 8px; }
  .lang { position: relative; }
  .lang-btn { width: 34px; height: 34px; padding: 0; border: none; border-radius: 6px; cursor: pointer; background: rgba(255,255,255,.07);
              color: var(--text); font: 500 11px 'Hanken Grotesk', Arial, sans-serif; letter-spacing: .08em; transition: transform .5s cubic-bezier(.16,1,.3,1); }
  .lang-btn:hover { transform: scale(1.03); }
  .lang-menu { position: absolute; z-index: 5; top: calc(100% + 12px); right: 0; min-width: 150px; padding: 6px; border-radius: 10px;
               background: rgba(16,16,16,.72); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); transform-origin: top right;
               opacity: 0; visibility: hidden; transform: translateY(-6px) scale(.96);
               transition: opacity .3s ease, transform .45s cubic-bezier(.16,1,.3,1), visibility 0s linear .45s; }
  .lang.open .lang-menu { opacity: 1; visibility: visible; transform: none; transition: opacity .3s ease, transform .45s cubic-bezier(.16,1,.3,1), visibility 0s; }
  .lang-menu button { display: flex; justify-content: space-between; width: 100%; padding: 8px 10px; border: none; border-radius: 6px;
                      background: none; color: var(--muted); font: 400 12px 'Hanken Grotesk', Arial, sans-serif; cursor: pointer; }
  .lang-menu button:hover { background: rgba(255,255,255,.07); color: var(--text); }
  .lang-menu button.on { color: var(--text); font-weight: 500; }
  .lang-menu small { font-size: 10px; letter-spacing: .08em; color: var(--muted); }
  .log { flex: 1; overflow-y: auto; padding: 4px; display: flex; flex-direction: column; gap: 12px;
         scrollbar-width: thin; scrollbar-color: #333333 transparent; }
  .msg { max-width: 88%; padding: 12px 15px; border-radius: 10px; font-size: 14px; line-height: 1.55;
         border: 1px solid var(--edge); }
  .msg.user { align-self: flex-end; background: rgba(255,255,255,.08); border-color: transparent; }
  .msg.bot { align-self: flex-start; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .msg.note { align-self: center; max-width: 100%; background: none; border: none; color: var(--muted); font-size: 12px; text-align: center; }
  .msg p { margin: 0 0 8px; } .msg p:last-child { margin: 0; }
  .msg ul { margin: 4px 0 8px; padding-left: 20px; } .msg li { margin: 2px 0; }
  .msg h4 { margin: 12px 0 4px; font-size: 11px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  .msg h4:first-child { margin-top: 0; }
  .msg a { color: var(--accent); } .msg code { font-size: 12.5px; background: rgba(255,255,255,.06); padding: 1px 5px; border-radius: 5px; }
  .typing span { display: inline-block; width: 6px; height: 6px; margin-right: 4px; border-radius: 50%; background: var(--muted);
                 animation: blink 1.2s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 4px 12px; }
  .chips button { border: 1px solid var(--edge); background: rgba(255,255,255,.03); color: var(--text); border-radius: 999px;
                  padding: 7px 13px; font: 12px 'Hanken Grotesk', Arial, sans-serif; cursor: pointer; transition: border-color .2s, color .2s; }
  .chips button:hover { border-color: rgba(255,255,255,.25); }
  form { display: flex; gap: 8px; padding: 10px; border-radius: 10px; background: var(--glass); border: 1px solid var(--edge);
         backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  textarea { flex: 1; resize: none; border: none; outline: none; background: none; color: var(--text);
             font: 15px/1.45 'Hanken Grotesk', Arial, sans-serif; padding: 6px 8px; max-height: 140px; }
  textarea::placeholder { color: var(--faint); }
  footer { padding: 10px 4px 0; font-size: 10px; color: var(--faint); text-align: center; }
  footer a { color: var(--faint); }
  @media (max-width: 600px) { .msg { max-width: 96%; font-size: 13.5px; } .brand { font-size: 12px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand"><b>BALDWIN</b> <span>ALEXANDRIA</span></div>
      <div class="sub"><span class="l-cs">Knihovna zdrojů · ptejte se, odkud čísla jsou a jak ovlivňují výpočty</span><span class="l-en">Source library · ask where the numbers come from and how they move the calculations</span><span class="l-sk">Knižnica zdrojov · pýtajte sa, odkiaľ sú čísla a ako ovplyvňujú výpočty</span></div>
    </div>
    <div class="hr">
    <a class="orb-link" href="../acre/" aria-label="Baldwin Acre">
      <span class="ic"><svg viewBox="0 0 24 24"><path d="M2.5 15.5l9.5-5.2 9.5 5.2-9.5 5.2z"/>
        <path d="M7.2 12.9l9.5 5.2" stroke-dasharray="1.6 1.6"/><path d="M12 10.3V3.6l3.6 1.4-3.6 1.4"/>
        <circle cx="2.5" cy="15.5" r=".9" fill="currentColor" stroke="none"/><circle cx="21.5" cy="15.5" r=".9" fill="currentColor" stroke="none"/>
        <circle cx="12" cy="20.7" r=".9" fill="currentColor" stroke="none"/></svg></span>
      <span class="tx"><b>BALDWIN</b> <span>ACRE</span></span>
    </a>
    <a class="orb-link" href="../" aria-label="Baldwin Palantir">
      <span class="ic"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M8.2 9.2a4.6 4.6 0 0 1 3.4-2.3"/></svg></span>
      <span class="tx"><b>BALDWIN</b> <span>PALANTIR</span></span>
    </a>
    <div class="lang">
      <button class="lang-btn" aria-label="Language"><span class="l-cs">CS</span><span class="l-en">EN</span><span class="l-sk">SK</span></button>
      <div class="lang-menu">
        <button data-lang="en">English <small>EN</small></button>
        <button data-lang="cs">Čeština <small>CS</small></button>
        <button data-lang="sk">Slovenčina <small>SK</small></button>
      </div>
    </div>
    </div>
  </header>
  <div class="log" id="log"></div>
  <div class="chips" id="chips">
    <button></button>
  </div>
  <form id="ask">
    <textarea id="q" rows="1" autocomplete="off"></textarea>
  </form>
  <footer>Google Gemini</footer>
</div>
<script>
  // The Cloudflare Worker that talks to Gemini (see worker.js); empty until it is deployed.
  const WORKER_URL = "https://baldwin-alexandria.artur20papp.workers.dev";

  const log = document.getElementById("log"), q = document.getElementById("q");
  const history = [];
  let busy = false;  // one question at a time (Enter sends)
  q.placeholder = t("Zeptejte se na zdroj nebo výpočet…", "Ask about a source or a calculation…", "Opýtajte sa na zdroj alebo výpočet…");
  document.querySelector("#chips button").textContent =
    t("Které vstupy jsou jen předpoklady?", "Which inputs are just assumptions?", "Ktoré vstupy sú len predpoklady?");
  // back to the map without its start screen
  document.querySelector('.orb-link[href="../"]').addEventListener("click", () => {
    try { sessionStorage.setItem("baldwin-skip-intro", "1"); } catch (e) {}
  });
  // the language switcher: a choice reloads the page (the map follows it too)
  const lang = document.querySelector(".lang");
  lang.querySelector(`[data-lang="${window.baldwinLang}"]`).classList.add("on");
  lang.querySelector(".lang-btn").addEventListener("click", (e) => { e.stopPropagation(); lang.classList.toggle("open"); });
  lang.querySelector(".lang-menu").addEventListener("click", (e) => {
    const b = e.target.closest("button");
    if (b) window.baldwinSetLang(b.dataset.lang);
  });
  document.addEventListener("click", (e) => { if (!lang.contains(e.target)) lang.classList.remove("open"); });

  // Tiny, safe Markdown: escape everything first, then bold, code, links, bullet lists and paragraphs.
  function md(text) {
    const esc = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const inline = (s) => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[^*\w])\*([^*\n]+?)\*(?!\*)/g, "$1<i>$2</i>")
      .replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/(^|[\s(])(https?:\/\/[^\s)<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    // headings ("### Zdroj") become blocks of their own
    return esc.replace(/^(#{1,6} .*)$/gm, "\n\n$1\n\n").trim().split(/\n{2,}/).map((block) => {
      const lines = block.split("\n");
      if (lines.length === 1 && /^#{1,6} /.test(lines[0])) return `<h4>${inline(lines[0].replace(/^#{1,6} /, ""))}</h4>`;
      if (lines.every((l) => /^\s*[-*•] /.test(l))) return "<ul>" + lines.map((l) => `<li>${inline(l.replace(/^\s*[-*•] /, ""))}</li>`).join("") + "</ul>";
      return `<p>${lines.map(inline).join("<br>")}</p>`;
    }).join("");
  }

  function add(role, html) {
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    div.innerHTML = html;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  if (!WORKER_URL) add("note", t("Alexandria ještě není připojená k modelu (chybí adresa Workeru).",
                               "Alexandria isn't connected to the model yet (no Worker address).",
                               "Alexandria ešte nie je pripojená k modelu (chýba adresa Workera)."));

  async function ask(text) {
    text = text.trim();
    if (!text || busy) return;
    document.getElementById("chips").style.display = "none";
    add("user", md(text));
    history.push({ role: "user", text });
    q.value = ""; q.style.height = "";
    busy = true;
    const wait = add("bot", '<span class="typing"><span></span><span></span><span></span></span>');
    try {
      if (!WORKER_URL) throw new Error(t("Alexandria ještě není připojená.", "Alexandria isn't connected yet.", "Alexandria ešte nie je pripojená."));
      const res = await fetch(WORKER_URL, { method: "POST", headers: { "content-type": "application/json" },
                                            body: JSON.stringify({ messages: history }) });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || `${t("chyba", "error", "chyba")} ${res.status}`);
      wait.innerHTML = md(data.text);
      history.push({ role: "assistant", text: data.text });
    } catch (err) {
      wait.className = "msg note";
      wait.textContent = t("Nepodařilo se odpovědět: ", "Couldn't answer: ", "Nepodarilo sa odpovedať: ") + err.message;
      history.pop();
    }
    busy = false;
    log.scrollTop = log.scrollHeight;
    q.focus();
  }

  document.getElementById("ask").addEventListener("submit", (e) => { e.preventDefault(); ask(q.value); });
  q.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(q.value); } });
  q.addEventListener("input", () => { q.style.height = ""; q.style.height = Math.min(140, q.scrollHeight) + "px"; });
  document.getElementById("chips").addEventListener("click", (e) => { if (e.target.tagName === "BUTTON") ask(e.target.textContent); });
</script>
</body>
</html>
