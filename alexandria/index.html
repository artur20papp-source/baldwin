<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Baldwin Alexandria</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Baldwin Alexandria: chat with the source library of Baldwin Palantir and Baldwin Acre.
     Same look as the map: near-black, glass panels, the green accent and a faint orange glow. */
  :root { --bg: #0b0c0e; --text: #ececec; --muted: #7d828c; --faint: #5c6068; --accent: #8fe3a0;
          --glass: rgba(18,20,24,.72); --edge: rgba(255,255,255,.07); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: Inter, Arial, sans-serif; }
  body { display: flex; justify-content: center;
         background: radial-gradient(ellipse 60% 40% at 50% -5%, rgba(220,80,30,.09), rgba(0,0,0,0) 70%), var(--bg); }
  .wrap { width: 100%; max-width: 760px; height: 100%; display: flex; flex-direction: column; padding: 20px 16px 16px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; padding: 4px 4px 16px; }
  .brand { font-size: 15px; letter-spacing: .34em; }
  .brand b { font-weight: 600; } .brand span { color: var(--muted); font-weight: 400; }
  .sub { font-size: 11px; color: var(--muted); letter-spacing: .04em; margin-top: 6px; }
  header a { color: var(--muted); font-size: 11px; letter-spacing: .12em; text-transform: uppercase; text-decoration: none; white-space: nowrap; }
  header a:hover { color: var(--accent); }
  .log { flex: 1; overflow-y: auto; padding: 4px; display: flex; flex-direction: column; gap: 12px;
         scrollbar-width: thin; scrollbar-color: #2e3138 transparent; }
  .msg { max-width: 88%; padding: 12px 15px; border-radius: 14px; font-size: 14px; line-height: 1.55;
         border: 1px solid var(--edge); }
  .msg.user { align-self: flex-end; background: rgba(143,227,160,.12); border-color: rgba(143,227,160,.2); }
  .msg.bot { align-self: flex-start; background: var(--glass); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  .msg.note { align-self: center; max-width: 100%; background: none; border: none; color: var(--muted); font-size: 12px; text-align: center; }
  .msg p { margin: 0 0 8px; } .msg p:last-child { margin: 0; }
  .msg ul { margin: 4px 0 8px; padding-left: 20px; } .msg li { margin: 2px 0; }
  .msg a { color: var(--accent); } .msg code { font-size: 12.5px; background: rgba(255,255,255,.06); padding: 1px 5px; border-radius: 5px; }
  .typing span { display: inline-block; width: 6px; height: 6px; margin-right: 4px; border-radius: 50%; background: var(--muted);
                 animation: blink 1.2s infinite ease-in-out; }
  .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 4px 12px; }
  .chips button { border: 1px solid var(--edge); background: rgba(255,255,255,.03); color: var(--text); border-radius: 999px;
                  padding: 7px 13px; font: 12px Inter, Arial, sans-serif; cursor: pointer; transition: border-color .2s, color .2s; }
  .chips button:hover { border-color: rgba(143,227,160,.45); color: var(--accent); }
  form { display: flex; gap: 8px; padding: 10px; border-radius: 16px; background: var(--glass); border: 1px solid var(--edge);
         backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  textarea { flex: 1; resize: none; border: none; outline: none; background: none; color: var(--text);
             font: 15px/1.45 Inter, Arial, sans-serif; padding: 6px 8px; max-height: 140px; }
  textarea::placeholder { color: var(--faint); }
  form button { border: none; border-radius: 11px; padding: 0 16px; background: var(--accent); color: #0b0c0e;
                font: 600 12px Inter, Arial, sans-serif; letter-spacing: .06em; cursor: pointer; }
  form button:disabled { filter: grayscale(.7); cursor: progress; }
  footer { padding: 10px 4px 0; font-size: 10px; color: var(--faint); text-align: center; }
  footer a { color: var(--faint); }
  @media (max-width: 600px) { .msg { max-width: 96%; font-size: 13.5px; } .brand { font-size: 12px; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="brand"><b>BALDWIN</b> <span>ALEXANDRIA</span></div>
      <div class="sub">Knihovna zdrojů · ptejte se, odkud čísla jsou a jak ovlivňují výpočty</div>
    </div>
    <a href="../">← Palantir</a>
  </header>
  <div class="log" id="log"></div>
  <div class="chips" id="chips">
    <button>Odkud je prodejní cena 17 000 Kč/m² a co ovlivňuje?</button>
    <button>Které vstupy jsou jen předpoklady?</button>
    <button>How does the ZPF fee affect the result?</button>
    <button>What does the map export fill into Baldwin Acre?</button>
  </div>
  <form id="ask">
    <textarea id="q" rows="1" placeholder="Zeptejte se na zdroj nebo výpočet…" autocomplete="off"></textarea>
    <button id="send">Zeptat se</button>
  </form>
  <footer>Odpovídá jen z <a href="knowledge.md" target="_blank" rel="noopener">knihovny zdrojů projektu</a> · Google Gemini · může se mýlit, ověřte u zdroje</footer>
</div>
<script>
  // The Cloudflare Worker that talks to Gemini (see worker.js); empty until it is deployed.
  const WORKER_URL = "https://baldwin-alexandria.artur20papp.workers.dev";

  const log = document.getElementById("log"), q = document.getElementById("q"), send = document.getElementById("send");
  const history = [];

  // Tiny, safe Markdown: escape everything first, then bold, code, links, bullet lists and paragraphs.
  function md(text) {
    const esc = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    const inline = (s) => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>")
      .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>')
      .replace(/(^|[\s(])(https?:\/\/[^\s)<]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
    return esc.split(/\n{2,}/).map((block) => {
      const lines = block.split("\n");
      if (lines.every((l) => /^\s*[-*•] /.test(l))) return "<ul>" + lines.map((l) => `<li>${inline(l.replace(/^\s*[-*•] /, ""))}</li>`).join("") + "</ul>";
      return `<p>${lines.map(inline).join("<br>")}</p>`;
    }).join("");
  }

  function add(role, html) {
    const div = document.createElement("div");
    div.className = `msg ${role}`;
    div.innerHTML = html;
    log.appendChild(div);
    log.scrollTop = log.scrollHeight;
    return div;
  }

  add("bot", md("Dobrý den, jsem **Baldwin Alexandria**, knihovna zdrojů projektu Baldwin Palantir a modelu Baldwin Acre. " +
                "Zeptejte se, odkud je které číslo, jak je spočítané a co ve výpočtu ovlivňuje. Odpovídám jen z toho, co projekt opravdu použil.\n\n" +
                "Ask in English too."));
  if (!WORKER_URL) add("note", "Alexandria ještě není připojená k modelu (chybí adresa Workeru).");

  async function ask(text) {
    text = text.trim();
    if (!text || send.disabled) return;
    document.getElementById("chips").style.display = "none";
    add("user", md(text));
    history.push({ role: "user", text });
    q.value = ""; q.style.height = "";
    send.disabled = true;
    const wait = add("bot", '<span class="typing"><span></span><span></span><span></span></span>');
    try {
      if (!WORKER_URL) throw new Error("Alexandria ještě není připojená.");
      const res = await fetch(WORKER_URL, { method: "POST", headers: { "content-type": "application/json" },
                                            body: JSON.stringify({ messages: history }) });
      const data = await res.json();
      if (!res.ok || data.error) throw new Error(data.error || `chyba ${res.status}`);
      wait.innerHTML = md(data.text);
      history.push({ role: "assistant", text: data.text });
    } catch (err) {
      wait.className = "msg note";
      wait.textContent = "Nepodařilo se odpovědět: " + err.message;
      history.pop();
    }
    send.disabled = false;
    log.scrollTop = log.scrollHeight;
    q.focus();
  }

  document.getElementById("ask").addEventListener("submit", (e) => { e.preventDefault(); ask(q.value); });
  q.addEventListener("keydown", (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); ask(q.value); } });
  q.addEventListener("input", () => { q.style.height = ""; q.style.height = Math.min(140, q.scrollHeight) + "px"; });
  document.getElementById("chips").addEventListener("click", (e) => { if (e.target.tagName === "BUTTON") ask(e.target.textContent); });
</script>
</body>
</html>
